
trigger:
  branches:
    include:
      - feature/dev/101
pool:
  name: Jagseer-pc
  
variables:
  TF_VAR_environment: dev
  
stages:
  - stage: Terraform_init
    displayName: Terraform installInit
    jobs:
      - job: Terraforminit
        displayName: Terraform init
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          env:
            TF_VAR_environment: $(TF_VAR_environment)
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            backendServiceArm: 'Sp1'
            backendAzureRmOverrideSubscriptionID: '68091150-801e-4498-8be2-e5d4bcf9919c'
            backendAzureRmResourceGroupName: 'imigrant-help'
            backendAzureRmStorageAccountName: 'jagseerstg123'
            backendAzureRmContainerName: 'containertf'
            backendAzureRmKey: 'dev.terraform.tfstate'

        
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'custom'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            outputTo: 'console'
            customCommand: 'fmt'
            environmentServiceNameAzureRM: 'Sp1'
            environmentAzureRmOverrideSubscriptionID: '68091150-801e-4498-8be2-e5d4bcf9919c'

      - job: tfsec
        displayName: tfsec scan
        dependsOn: Terraforminit
        steps:
        - task: tfsec@1
          continueOnError: true
          inputs:
            version: 'v1.26.0'
            dir: '$(System.DefaultWorkingDirectory)/Environment/Dev'

      - job: tflint
        displayName: tflint
        dependsOn: tfsec
        steps:
        - task: PowerShell@2
          continueOnError: true
          inputs:
            targetType: 'inline'
            script: |
              winget install TerraformLinters.tflint
              ls
              tflint
            errorActionPreference: 'continue'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
  - stage: CostStage
    dependsOn: Terraform_installer_Initplan
    displayName: Cost & Impact Assessment Stage
    jobs:
    - job: InfraCost
      displayName: infra cost
      steps:
      - task: InfracostSetup@2
        inputs:
          apiKey: '$(INFRACOST_API_KEY)'
          version: '0.10.x'
      - task: PowerShell@2
        displayName: infracost estimate
        inputs:
          targetType: 'inline'
          script: 'infracost breakdown --path $(System.DefaultWorkingDirectory)/Environment/Dev'
          errorActionPreference: 'continue'
          workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
  - stage: TerraformPlan
    displayName: Terraform plan & Review
    jobs:
      - job: Terraform_plan
        displayName: Terraform plan And Review
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          env:
            TF_VAR_environment: $(TF_VAR_environment)
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            backendServiceArm: 'Sp1'
            backendAzureRmOverrideSubscriptionID: '68091150-801e-4498-8be2-e5d4bcf9919c'
            backendAzureRmResourceGroupName: 'imigrant-help'
            backendAzureRmStorageAccountName: 'jagseerstg123'
            backendAzureRmContainerName: 'containertf'
            backendAzureRmKey: 'dev.terraform.tfstate'
        - task: TerraformTask@5
          env:
            TF_VAR_environment: $(TF_VAR_environment)
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            environmentServiceNameAzureRM: 'Sp1'
            environmentAzureRmOverrideSubscriptionID: '68091150-801e-4498-8be2-e5d4bcf9919c'
  - stage: Approval
    displayName: Approval Stage
    dependsOn: TerraformPlan
    jobs:
      - job: ManualApproval
        displayName: Manual Approval job
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'jagseersidhu22@gmail.com'
            approvers: 'jagseersidhu22@gmail.com'
            instructions: 'please check the infra pipeline and approve if its allright to proceed further for Apply the infra'
  - stage: Apply
    dependsOn: Approval
    displayName: Terraform Apply Stage
    jobs:
      - job: TerraformApplyJob
        displayName: Terraform Apply
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          env:
            TF_VAR_environment: $(TF_VAR_environment)
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            backendServiceArm: 'Sp1'
            backendAzureRmOverrideSubscriptionID: '68091150-801e-4498-8be2-e5d4bcf9919c'
            backendAzureRmResourceGroupName: 'imigrant-help'
            backendAzureRmStorageAccountName: 'jagseerstg123'
            backendAzureRmContainerName: 'containertf'
            backendAzureRmKey: 'dev.terraform.tfstate'
        - task: TerraformTask@5
          env:
            TF_VAR_environment: $(TF_VAR_environment)
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
            environmentServiceNameAzureRM: 'Sp1'
